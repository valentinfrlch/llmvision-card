name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
    
      - name: Diagnose checkout
        run: |
          git rev-parse HEAD
          pwd
          ls -la
          node --version
          npm --version
          sha256sum package.json package-lock.json
          head -n 10 package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build card
        run: npm run build

      - name: Verify dist matches latest build
        run: git diff --exit-code -- dist/

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: llmvision-card-dist
          path: dist/
          if-no-files-found: error